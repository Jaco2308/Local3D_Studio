[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local3d-studio"
version = "2.0.0"
description = "Universal 16GB-Safe AI-to-3D Manufacturing & Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Local3D Studio Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "3d-printing",
    "bambu-studio",
    "orcaslicer",
    "3mf",
    "stl",
    "hunyuan3d",
    "blender",
    "generative-ai",
    "local-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.12",
    "requests>=2.31.0",
    "psutil>=6.0.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.4",
    "huggingface-hub>=0.24.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.18.0",
    "trimesh>=4.4.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "opencv-python-headless>=4.10.0",
    "gradio_client>=1.3.0"
]

[project.urls]
Homepage = "https://github.com/Jaco2308/Local3D_Studio"
Repository = "https://github.com/Jaco2308/Local3D_Studio.git"
Documentation = "https://github.com/Jaco2308/Local3D_Studio#readme"

[project.scripts]
local3d = "server:main"
